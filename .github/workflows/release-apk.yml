name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example: v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag: $TAG"
            echo "Use a version such as v1.0.0"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        run: ./gradlew clean assembleDebug assembleRelease

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release-files

          cp app/build/outputs/apk/debug/app-debug.apk             "release-files/SelfLock-${TAG}-debug.apk"

          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$RELEASE_APK" ]; then
            echo "Release APK was not generated."
            exit 1
          fi

          if [[ "$RELEASE_APK" == *"-unsigned.apk" ]]; then
            cp "$RELEASE_APK" "release-files/SelfLock-${TAG}-release-unsigned.apk"
          else
            cp "$RELEASE_APK" "release-files/SelfLock-${TAG}-release.apk"
          fi

          (
            cd release-files
            sha256sum *.apk > SHA256SUMS.txt
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SelfLock-${{ steps.tag.outputs.tag }}-apks
          path: release-files/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-files/*.apk
            release-files/SHA256SUMS.txt
